name: Quality Manager Daily Verification & Self-Healing

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (08:00 AM Singapore Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows 1-tap manual inspection from GitHub mobile or browser

jobs:
  daily-quality-audit:
    name: Inspect Amazon Links, Photos & Descriptions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛡️ Run Quality Manager Live Inspection
        env:
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          node scripts/quality-manager-daily-check.js .
